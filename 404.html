<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL path, encodes it, and then redirects to
      // the app's root URL, appending the encoded path as a query parameter.
      // The main index.html then uses this query parameter to restore the path.

      // NOTE: Adjust the pathSegmentsToKeep if your app is deeply nested within
      // the repository. For example, if your URL is
      // https://bpbhardwaj18.github.io/gamehub-react-app/level1/level2/
      // and you want to redirect to the base URL, you might need to keep more
      // path segments. Since your base URL includes "gamehub-react-app",
      // pathSegmentsToKeep should generally be 1 (for "gamehub-react-app").
      var pathSegmentsToKeep = 1; // For https://bpbhardwaj18.github.io/gamehub-react-app/

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, pathSegmentsToKeep + 1).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
      );
    </script>
  </head>
  <body>
    This page has been moved or no longer exists. Redirecting to the main page...
  </body>
</html>
